project:
  type: website
  # Lista blanca de lo que se renderiza: una carpeta nueva con .qmd NO entra en el
  # sitio hasta que se añada aquí. Lo privado y de apoyo (referencias/, privado/,
  # moodle/, pruebas/) nunca se renderiza. Los archivos que empiezan por «_» los
  # ignora Quarto (plantillas).
  render:
    - index.qmd
    - guia/**/*.qmd
    - proyecto/**/*.qmd
    - temas/**/*.qmd
    - problemas/**/*.qmd
    - laboratorio/**/*.qmd
    - simulaciones/**/*.qmd
    - programacion/**/*.qmd
    - matematicas/**/*.qmd
    - autoevaluacion/**/*.qmd
    - historia/**/*.qmd
    - recursos/**/*.qmd
  # Se copian tal cual (módulos JS cargados como archivo, no incrustados).
  resources:
    - recursos/js/**/*.js
    - "!recursos/js/**/*.test.js"
    - "!recursos/js/test/**"
    - "!_site/**"
    - "!_site-pruebas/**"
  post-render:
    - scripts/no_publicar.py

# La barra superior y las laterales las genera scripts/generar_estructura.py
# desde temario.toml. _versiones.yml lo edita una persona.
metadata-files:
  - _navegacion.yml
  - _versiones.yml

lang: es
bibliography: recursos/bibliografia.bib

# Orden: versión y bloques antes de Quarto (necesitan citas sin procesar);
# ejercicios y simulaciones después (para ver lo que generan los shortcodes).
filters:
  - scripts/lua/version_tema.lua
  - scripts/lua/referencias.lua
  - scripts/lua/bloques.lua
  - quarto
  - scripts/lua/ejercicios.lua
  - scripts/lua/recursos_globales.lua

shortcodes:
  - scripts/lua/num.lua
  - scripts/lua/codigo.lua
  - scripts/lua/pregunta.lua

website:
  title: "RESISTENCIA"
  description: "Elasticidad y Resistencia de Materiales II · Universidad de Córdoba"
  site-url: https://me1catrr.github.io/resistencia/
  repo-url: https://github.com/me1catrr/resistencia
  repo-actions: [issue]
  search:
    location: navbar
    type: overlay
  page-footer:
    center: "RESISTENCIA · código MIT · contenidos CC BY-SA 4.0 · recurso docente abierto, no sustituye a la guía docente oficial"

format:
  html:
    theme:
      light: [cosmo, recursos/css/claro.scss]
      dark: [cosmo, recursos/css/oscuro.scss]
    css: recursos/css/resistencia.css
    respect-user-color-scheme: true
    toc: true
    toc-title: "En esta página"
    code-copy: true
    code-overflow: wrap
    lightbox: auto
    citations-hover: true
    citation-location: margin
    link-citations: true
    grid:
      sidebar-width: 280px
      body-width: 860px
      margin-width: 260px
      gutter-width: 1.5rem
    html-math-method: mathjax

# Etiquetas en español y un tipo propio para numerar las simulaciones.
crossref:
  fig-title: "Figura"
  tbl-title: "Tabla"
  eq-prefix: "ecuación"
  fig-prefix: "figura"
  tbl-prefix: "tabla"
  sec-prefix: "apartado"
  thm-title: "Teorema"
  prp-title: "Proposición"
  def-title: "Definición"
  exm-title: "Ejemplo"
  lem-title: "Lema"
  cor-title: "Corolario"
  thm-prefix: "teorema"
  prp-prefix: "proposición"
  def-prefix: "definición"
  exm-prefix: "ejemplo"
  lem-prefix: "lema"
  cor-prefix: "corolario"
  custom:
    - kind: float
      reference-prefix: "Simulación"
      key: sim
      latex-env: simulacion

execute:
  enabled: false
